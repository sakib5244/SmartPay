services:
  - type: web
    name: smartpay-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartpay-db
          property: connectionString

databases:
  - name: smartpay-db
    plan: free
